# ClusterIP only - no public load balancer. Access the app with:
#   kubectl -n workshop-shop port-forward svc/workshop-shop 8080:80
apiVersion: v1
kind: Service
metadata:
  name: workshop-shop
  namespace: workshop-shop
  labels:
    app: workshop-shop
spec:
  type: ClusterIP
  selector:
    app: workshop-shop
  ports:
    - port: 80
      targetPort: 3000
